<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navera Ultimate Inventory Suite</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #fdfbf7; }
        .card { background: white; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
    </style>
</head>
<body class="p-4">

    <div class="max-w-md mx-auto">
        <h1 class="text-xl font-bold text-amber-900 mb-4 text-center">Navera Inventory Suite</h1>
        
        <!-- Tab Switcher -->
        <div class="flex bg-stone-200 p-1 rounded-xl mb-4 text-xs font-bold">
            <button onclick="switchTab('po')" id="tabPoBtn" class="flex-1 py-2 rounded-lg bg-white text-amber-900 shadow">📁 นับจากไฟล์ PO</button>
            <button onclick="switchTab('manual')" id="tabManualBtn" class="flex-1 py-2 rounded-lg text-stone-600">✍️ คีย์เอง + สแกน</button>
        </div>

        <!-- ================= MODE 1: PO & SCANNER ================= -->
        <div id="sectionPo" class="space-y-4">
            <div class="card p-4 border-l-4 border-amber-600">
                <label class="block text-sm font-bold mb-2">1. อัปโหลดไฟล์ Excel (.xlsx)</label>
                <input type="file" id="inputExcel" class="w-full text-sm">
                <p id="poStatus" class="text-xs text-stone-500 mt-1">ยังไม่ได้โหลดไฟล์</p>
            </div>

            <div class="card p-4">
                <div id="reader" class="w-full h-48 bg-black rounded overflow-hidden"></div>
                <div class="flex gap-2 mt-3">
                    <button onclick="startScanner('po')" class="flex-1 bg-amber-700 text-white py-2 rounded font-bold text-sm">📷 เปิดกล้องสแกน</button>
                    <button onclick="stopScanner()" class="flex-1 bg-stone-600 text-white py-2 rounded font-bold text-sm">⏹️ ปิดกล้อง</button>
                </div>
            </div>

            <div class="card p-4 border-2 border-stone-300">
                <h3 class="text-xs font-bold text-stone-700 mb-1">🔍 ค้นหาชื่อสินค้า (พิมพ์เพื่อเลือกนับ)</h3>
                <input type="text" id="liveSearchInput" oninput="onLiveSearchInput()" class="w-full border rounded p-2 text-sm mb-2" placeholder="พิมพ์ชื่อหรือรหัสสินค้า...">
                <div id="liveResultList" class="max-h-40 overflow-y-auto space-y-1"></div>
            </div>
        </div>

        <!-- ================= MODE 2: MANUAL ENTRY ================= -->
        <div id="sectionManual" class="space-y-4 hidden">
            <div class="card p-4 border-l-4 border-emerald-600">
                <h3 class="font-bold text-stone-700 text-sm mb-2">📷 สแกนเพิ่มรายการใหม่</h3>
                <div id="readerManual" class="w-full h-40 bg-black rounded overflow-hidden mb-3"></div>
                <button onclick="startScanner('manual')" class="w-full bg-emerald-700 text-white py-2 rounded font-bold text-sm">📷 เปิดกล้องสแกน</button>
            </div>
            <div class="card p-4 border-l-4 border-amber-600 space-y-2">
                <h3 class="font-bold text-stone-700 text-sm">✍️ เพิ่มสินค้าใหม่ (ไม่มีในไฟล์ PO)</h3>
                <input type="text" id="customCode" class="w-full border rounded p-2 text-sm" placeholder="รหัสสินค้า / บาร์โค้ด (Code)">
                <input type="text" id="customDesc" class="w-full border rounded p-2 text-sm" placeholder="ชื่อสินค้า (Description)">
                <div class="grid grid-cols-2 gap-2">
                    <input type="text" id="customUnit" class="w-full border rounded p-2 text-sm" placeholder="Unit (เช่น btl, can)">
                    <input type="text" id="customSubUnit" class="w-full border rounded p-2 text-sm" placeholder="Sub unit (เช่น oz, gl)">
                </div>
                <input type="number" id="customSubUnitItem" class="w-full border rounded p-2 text-sm" placeholder="จำนวน Sub unit ต่อ 1 Unit (ถ้ามี เช่น 22) - ไม่บังคับ">

                <div class="bg-stone-50 p-3 rounded border space-y-1">
                    <label class="block text-xs font-bold text-stone-700">1. Count by Unit (btl/can)</label>
                    <input type="text" id="customQtyUnit" readonly onclick="openKeypad('customQtyUnit', 'Count by Unit')" class="w-full border rounded p-2 font-bold text-center text-emerald-700 text-lg bg-white cursor-pointer" value="0">
                </div>
                <div class="bg-stone-50 p-3 rounded border space-y-1">
                    <label class="block text-xs font-bold text-stone-700">2. Count by Sub Unit (oz/gl)</label>
                    <input type="text" id="customQtySubUnit" readonly onclick="openKeypad('customQtySubUnit', 'Count by Sub Unit')" class="w-full border rounded p-2 font-bold text-center text-amber-700 text-lg bg-white cursor-pointer" value="0">
                </div>

                <button onclick="addCustomItem()" class="w-full bg-amber-700 text-white py-2 rounded font-bold text-sm">➕ เพิ่มรายการ</button>
            </div>
        </div>


        <!-- Count Panel -->
        <div id="countPanel" class="card p-4 my-4 hidden border-2 border-emerald-500 space-y-3">
            <div>
                <h3 class="text-xs text-stone-500">กำลังนับสินค้ารายการนี้:</h3>
                <h2 id="itemName" class="font-bold text-amber-900 text-base mb-1"></h2>
                <p class="text-xs text-stone-600">รหัส: <span id="currentBarcode" class="font-mono font-bold">-</span></p>
            </div>

            <div id="itemHistoryBox" class="hidden bg-amber-50 border border-amber-300 rounded p-2 text-xs space-y-1">
                <p class="font-bold text-amber-800">🕒 เคยนับไปแล้ว (จุดอื่น):</p>
                <div id="itemHistoryList" class="space-y-0.5"></div>
                <p class="font-bold text-amber-900 pt-1 border-t border-amber-200">รวมสะสมทุกจุด: <span id="itemHistoryTotal"></span></p>
            </div>

            <div>
                <label class="block text-xs font-bold text-stone-700 mb-1">📍 สถานที่ที่นับ (ไม่บังคับ)</label>
                <input type="text" id="fillLocationInput" class="w-full border rounded p-2 text-sm" placeholder="เช่น บาร์ 1, สโตร์, ห้องเก็บของ">
            </div>
            
            <div class="bg-stone-50 p-3 rounded border space-y-1">
                <label class="block text-xs font-bold text-stone-700">1. Count by Unit (btl/can)</label>
                <input type="text" id="qtyUnitInput" readonly onclick="openKeypad('qtyUnitInput', 'Count by Unit')" class="w-full border rounded p-2 font-bold text-center text-emerald-700 text-lg bg-white cursor-pointer" value="0">
            </div>

            <div class="bg-stone-50 p-3 rounded border space-y-1">
                <label class="block text-xs font-bold text-stone-700">2. Count by Sub Unit (oz/gl)</label>
                <input type="text" id="qtySubUnitInput" readonly onclick="openKeypad('qtySubUnitInput', 'Count by Sub Unit')" class="w-full border rounded p-2 font-bold text-center text-amber-700 text-lg bg-white cursor-pointer" value="0">
            </div>

            <button onclick="saveCount()" class="w-full bg-emerald-600 text-white rounded font-bold py-3 text-sm shadow">✅ บันทึกยอดนับ (จุดนี้)</button>

        </div>

        <!-- Summary & Export -->
        <div class="card p-4 mt-4">
            <h3 class="font-bold text-stone-700 text-sm mb-2">📊 สรุปรายการที่นับแล้ว (<span id="totalCountedItems">0</span> รายการ)</h3>
            <div id="summaryList" class="text-xs text-stone-600 max-h-48 overflow-y-auto mb-3 border p-2 rounded bg-stone-50 space-y-1">
                ยังไม่มีการบันทึกข้อมูล
            </div>
            <button onclick="exportExcel()" class="w-full bg-blue-700 text-white py-3 rounded-lg font-bold text-sm shadow">📥 Export เป็น Excel</button>
        </div>
    </div>

    <!-- ================= MODAL KEYPAD (POPUP 0-9) ================= -->
    <div id="keypadModal" class="fixed inset-0 bg-black/60 hidden flex items-center justify-center z-50 p-4">
        <div class="bg-white rounded-2xl w-full max-w-xs p-4 shadow-2xl border border-stone-200">
            <h3 id="keypadTitle" class="text-center font-bold text-stone-800 text-sm mb-2">กรอกตัวเลข</h3>
            <div id="keypadDisplay" class="bg-stone-100 border-2 border-amber-600 text-amber-900 font-bold text-2xl text-center py-3 rounded-xl mb-3">0</div>
            
            <div class="grid grid-cols-3 gap-2 mb-3">
                <button onclick="pressKey('1')" class="bg-stone-100 hover:bg-amber-100 py-3 rounded-xl font-bold text-lg text-stone-800 shadow-sm border">1</button>
                <button onclick="pressKey('2')" class="bg-stone-100 hover:bg-amber-100 py-3 rounded-xl font-bold text-lg text-stone-800 shadow-sm border">2</button>
                <button onclick="pressKey('3')" class="bg-stone-100 hover:bg-amber-100 py-3 rounded-xl font-bold text-lg text-stone-800 shadow-sm border">3</button>
                <button onclick="pressKey('4')" class="bg-stone-100 hover:bg-amber-100 py-3 rounded-xl font-bold text-lg text-stone-800 shadow-sm border">4</button>
                <button onclick="pressKey('5')" class="bg-stone-100 hover:bg-amber-100 py-3 rounded-xl font-bold text-lg text-stone-800 shadow-sm border">5</button>
                <button onclick="pressKey('6')" class="bg-stone-100 hover:bg-amber-100 py-3 rounded-xl font-bold text-lg text-stone-800 shadow-sm border">6</button>
                <button onclick="pressKey('7')" class="bg-stone-100 hover:bg-amber-100 py-3 rounded-xl font-bold text-lg text-stone-800 shadow-sm border">7</button>
                <button onclick="pressKey('8')" class="bg-stone-100 hover:bg-amber-100 py-3 rounded-xl font-bold text-lg text-stone-800 shadow-sm border">8</button>
                <button onclick="pressKey('9')" class="bg-stone-100 hover:bg-amber-100 py-3 rounded-xl font-bold text-lg text-stone-800 shadow-sm border">9</button>
                <button onclick="pressKey('C')" class="bg-rose-100 hover:bg-rose-200 text-rose-700 py-3 rounded-xl font-bold text-sm shadow-sm border">ล้าง (C)</button>
                <button onclick="pressKey('0')" class="bg-stone-100 hover:bg-amber-100 py-3 rounded-xl font-bold text-lg text-stone-800 shadow-sm border">0</button>
                <button onclick="pressKey('DEL')" class="bg-amber-100 hover:bg-amber-200 text-amber-900 py-3 rounded-xl font-bold text-sm shadow-sm border">⬅️ ลบ</button>
            </div>
            
            <div class="flex gap-2">
                <button onclick="closeKeypad(false)" class="flex-1 bg-stone-300 hover:bg-stone-400 text-stone-700 py-2 rounded-xl font-bold text-sm">ยกเลิก</button>
                <button onclick="closeKeypad(true)" class="flex-1 bg-emerald-600 hover:bg-emerald-700 text-white py-2 rounded-xl font-bold text-sm shadow">ตกลง</button>
            </div>
        </div>
    </div>

    <script>
        let poData = [];
        let countedUnitData = {};    
        let countedSubUnitData = {}; 
        let countHistory = {};       // { idx: [{unit, subUnit, location, time}, ...] } — ประวัติการนับแยกตามจุด
        let customItems = []; 
        let barcodeMap = {};  
        let currentItem = null;
        let html5QrCode = null;

        // ตัวแปรควบคุม Keypad Popup แบบ Concatenate
        let activeInputId = null;
        let currentTypedValue = "0";

        function openKeypad(inputId, labelTitle) {
            activeInputId = inputId;
            document.getElementById('keypadTitle').textContent = "กรอก: " + labelTitle;
            const existingVal = document.getElementById(inputId).value;
            currentTypedValue = (existingVal === "" || existingVal === "0") ? "0" : existingVal;
            document.getElementById('keypadDisplay').textContent = currentTypedValue;
            document.getElementById('keypadModal').classList.remove('hidden');
        }

        // แสดงประวัติการนับก่อนหน้าของสินค้ารายการนี้ (ถ้าเคยนับจากจุดอื่นมาแล้ว)
        function renderItemHistory(idx) {
            const hist = countHistory[idx] || [];
            const box = document.getElementById('itemHistoryBox');
            const list = document.getElementById('itemHistoryList');
            if (hist.length === 0) {
                box.classList.add('hidden');
                list.innerHTML = '';
                return;
            }
            box.classList.remove('hidden');
            list.innerHTML = hist.map((h, i) =>
                `<div>${i + 1}. ${h.location ? '[' + h.location + '] ' : ''}Unit ${h.unit} | Sub ${h.subUnit} <span class="text-stone-400">(${h.time})</span></div>`
            ).join('');
            const totalUnit = hist.reduce((s, h) => s + h.unit, 0);
            const totalSub = hist.reduce((s, h) => s + h.subUnit, 0);
            document.getElementById('itemHistoryTotal').textContent = `Unit ${totalUnit} | Sub ${totalSub}`;
        }

        // เปิด Count Panel ให้สินค้ารายการหนึ่ง (ใช้ทั้งจากผลค้นหาและจากการสแกนบาร์โค้ด)
        function openItemPanel(idx, barcodeDisplay) {
            const item = poData[idx];
            currentItem = { type: 'po', index: idx, data: item };
            document.getElementById('itemName').textContent = item.Description || item.Code;
            document.getElementById('currentBarcode').textContent = barcodeDisplay || item.Barcode || '(ไม่มีบาร์โค้ด)';
            document.getElementById('fillLocationInput').value = '';
            // เริ่มที่ 0 เสมอ เพราะถือเป็นยอดที่นับ ณ จุดนี้ (จุดใหม่) ไม่ใช่การแก้ไขยอดเดิม
            document.getElementById('qtyUnitInput').value = "0";
            document.getElementById('qtySubUnitInput').value = "0";
            renderItemHistory(idx);
            document.getElementById('countPanel').classList.remove('hidden');

            if (countHistory[idx] && countHistory[idx].length > 0) {
                const last = countHistory[idx][countHistory[idx].length - 1];
                alert(`ℹ️ สินค้านี้เคยนับไปแล้ว!\n${item.Description || item.Code}\n\nครั้งล่าสุด: ${last.location ? '[' + last.location + '] ' : ''}Unit ${last.unit} | Sub ${last.subUnit} (${last.time})\n\nกรอกจำนวนที่นับได้ ณ จุดนี้ ระบบจะรวมยอดสะสมให้อัตโนมัติ`);
            }
        }

        function pressKey(char) {
            if (char === 'C') {
                currentTypedValue = "0";
            } else if (char === 'DEL') {
                if (currentTypedValue.length > 1) {
                    currentTypedValue = currentTypedValue.slice(0, -1);
                } else {
                    currentTypedValue = "0";
                }
            } else {
                // Concatenate ตัวเลขต่อท้ายแบบเครื่องคิดเลข
                if (currentTypedValue === "0") {
                    currentTypedValue = char;
                } else {
                    currentTypedValue += char;
                }
            }
            document.getElementById('keypadDisplay').textContent = currentTypedValue;
        }

        function closeKeypad(isConfirm) {
            if (isConfirm && activeInputId) {
                document.getElementById(activeInputId).value = currentTypedValue;
            }
            document.getElementById('keypadModal').classList.add('hidden');
            activeInputId = null;
        }

        function switchTab(mode) {
            stopScanner();
            if (mode === 'po') {
                document.getElementById('sectionPo').classList.remove('hidden');
                document.getElementById('sectionManual').classList.add('hidden');
                document.getElementById('tabPoBtn').className = "flex-1 py-2 rounded-lg bg-white text-amber-900 shadow";
                document.getElementById('tabManualBtn').className = "flex-1 py-2 rounded-lg text-stone-600";
            } else {
                document.getElementById('sectionPo').classList.add('hidden');
                document.getElementById('sectionManual').classList.remove('hidden');
                document.getElementById('tabPoBtn').className = "flex-1 py-2 rounded-lg text-stone-600";
                document.getElementById('tabManualBtn').className = "flex-1 py-2 rounded-lg bg-white text-amber-900 shadow";
            }
        }

        document.getElementById('inputExcel').addEventListener('change', e => {
            const file = e.target.files[0];
            const reader = new FileReader();
            reader.onload = e => {
                try {
                    const data = new Uint8Array(e.target.result);
                    const workbook = XLSX.read(data, {type: 'array'});
                    const ws = workbook.Sheets[workbook.SheetNames[0]];
                    const rawJson = XLSX.utils.sheet_to_json(ws);
                    
                    poData = [];
                    barcodeMap = {};

                    rawJson.forEach((item, idx) => {
                        let newItem = {_index: idx};
                        for (let key in item) {
                            let cleanKey = key.replace(/\s+/g, ' ').trim();
                            newItem[cleanKey] = item[key];
                        }
                        poData.push(newItem);
                        
                        const barcodeVal = newItem.Barcode || newItem.BARCODE || newItem.barcode;
                        if (barcodeVal !== undefined && barcodeVal !== null) {
                            barcodeMap[String(barcodeVal).trim()] = idx;
                        }
                    });

                    document.getElementById('poStatus').textContent = `โหลดสำเร็จ: ${poData.length} รายการ`;
                } catch (err) {
                    document.getElementById('poStatus').textContent = "เกิดข้อผิดพลาดในการอ่านไฟล์";
                    console.error(err);
                }
            };
            reader.readAsArrayBuffer(file);
        });

        function onLiveSearchInput() {
            if (poData.length === 0) return;
            const keyword = document.getElementById('liveSearchInput').value.toLowerCase();
            const resultDiv = document.getElementById('liveResultList');
            resultDiv.innerHTML = '';

            if (!keyword) return;

            const matches = poData.filter(item => {
                const text = `${item.Code || ''} ${item.Description || ''} ${item.Category || ''}`.toLowerCase();
                return text.includes(keyword);
            });

            if (matches.length === 0) {
                resultDiv.innerHTML = '<p class="text-xs text-rose-500 p-1">ไม่พบสินค้าที่ค้นหา</p>';
                return;
            }

            matches.forEach(item => {
                const btn = document.createElement('button');
                btn.className = 'w-full text-left bg-stone-50 hover:bg-amber-100 p-2 rounded text-xs border border-stone-200 block';
                btn.innerHTML = `<b>[${item.Category || '-'}]</b> ${item.Code || ''} - ${item.Description || ''}`;
                btn.onclick = () => {
                    document.getElementById('liveResultList').innerHTML = '';
                    document.getElementById('liveSearchInput').value = '';
                    openItemPanel(item._index, item.Barcode);
                };
                resultDiv.appendChild(btn);
            });
        }

        function startScanner(targetMode) {
            stopScanner();
            const elementId = targetMode === 'po' ? 'reader' : 'readerManual';
            html5QrCode = new Html5Qrcode(elementId);
            
            html5QrCode.start(
                { facingMode: "environment" }, 
                { fps: 10, qrbox: 200 }, 
                (decodedText) => {
                    const code = decodedText.trim();
                    stopScanner();
                    
                    if (targetMode === 'po') {
                        if (barcodeMap[code] !== undefined) {
                            const idx = barcodeMap[code];
                            openItemPanel(idx, code);
                        } else {
                            alert(`❌ ไม่พบบาร์โค้ดนี้ในระบบ PO: ${code}`);
                        }
                    } else {
                        document.getElementById('customCode').value = code;
                    }
                },
                (errorMessage) => {}
            ).catch(err => {
                alert("ไม่สามารถเปิดกล้องได้: " + err);
            });
        }

        function stopScanner() { 
            if(html5QrCode && html5QrCode.isScanning) {
                html5QrCode.stop().then(() => html5QrCode.clear()).catch(() => {});
            }
        }

        function saveCount() {
            const unitQty = parseInt(document.getElementById('qtyUnitInput').value) || 0;
            const subUnitQty = parseInt(document.getElementById('qtySubUnitInput').value) || 0;
            const location = document.getElementById('fillLocationInput').value.trim();

            if (currentItem && currentItem.type === 'po') {
                const idx = currentItem.index;

                if (!countHistory[idx]) countHistory[idx] = [];
                countHistory[idx].push({
                    unit: unitQty,
                    subUnit: subUnitQty,
                    location: location,
                    time: new Date().toLocaleString('th-TH', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' })
                });

                // รวมยอดสะสมจากทุกจุดที่เคยนับสินค้ารายการนี้
                countedUnitData[idx] = countHistory[idx].reduce((s, h) => s + h.unit, 0);
                countedSubUnitData[idx] = countHistory[idx].reduce((s, h) => s + h.subUnit, 0);

                alert(`✅ บันทึกสำเร็จ!\n${currentItem.data.Description || currentItem.data.Code}\n\nยอดรวมสะสมทุกจุด: Unit ${countedUnitData[idx]} | Sub ${countedSubUnitData[idx]}`);
            }
            document.getElementById('countPanel').classList.add('hidden');
            updateSummaryUI();
        }

        function addCustomItem() {
            const code = document.getElementById('customCode').value.trim();
            const desc = document.getElementById('customDesc').value.trim();
            const unit = document.getElementById('customUnit').value.trim();
            const subUnit = document.getElementById('customSubUnit').value.trim();
            const subUnitItem = parseFloat(document.getElementById('customSubUnitItem').value) || 1;
            const unitQty = parseInt(document.getElementById('customQtyUnit').value) || 0;
            const subUnitQty = parseInt(document.getElementById('customQtySubUnit').value) || 0;

            if (!code && !desc) {
                alert("กรุณากรอกรหัสหรือชื่อสินค้า");
                return;
            }
            customItems.push({
                'Code': code,
                'Description': desc,
                'Unit': unit,
                'Sub unit': subUnit,
                'Sub unit item': subUnitItem,
                'Counted Unit Qty': unitQty,
                'Counted Sub Unit OZ/GL Qty': subUnitQty,
                'Convert': (unitQty * subUnitItem + subUnitQty) / subUnitItem
            });
            document.getElementById('customCode').value = '';
            document.getElementById('customDesc').value = '';
            document.getElementById('customUnit').value = '';
            document.getElementById('customSubUnit').value = '';
            document.getElementById('customSubUnitItem').value = '';
            document.getElementById('customQtyUnit').value = '0';
            document.getElementById('customQtySubUnit').value = '0';
            updateSummaryUI();
            alert("➕ เพิ่มรายการสำเร็จ (สินค้าใหม่ที่ไม่มีในไฟล์ PO)");
        }

        function updateSummaryUI() {
            const summaryDiv = document.getElementById('summaryList');
            const poKeys = Object.keys(countedUnitData).concat(Object.keys(countedSubUnitData)).filter((v, i, a) => a.indexOf(v) === i);
            const total = poKeys.length + customItems.length;
            document.getElementById('totalCountedItems').textContent = total;

            if (total === 0) {
                summaryDiv.innerHTML = "ยังไม่มีการบันทึกข้อมูล";
                return;
            }

            let html = "";
            poKeys.forEach(idx => {
                const item = poData[idx];
                const fillCount = (countHistory[idx] || []).length;
                const badge = fillCount > 1 ? ` <span class="text-stone-400">(📍${fillCount} จุด)</span>` : '';
                html += `<div class="bg-white p-1.5 rounded border mb-1 flex justify-between items-center">
                    <span><b>${item.Description || item.Code}</b>${badge}</span>
                    <span class="text-emerald-700 font-bold">Unit: ${countedUnitData[idx]||0} | Sub: ${countedSubUnitData[idx]||0}</span>
                </div>`;
            });
            customItems.forEach(ci => {
                html += `<div class="bg-amber-50 p-1.5 rounded border mb-1 flex justify-between items-center">
                    <span><b>🆕 ${ci.Description || ci.Code}</b></span>
                    <span class="text-amber-700 font-bold">Unit: ${ci['Counted Unit Qty']||0} | Sub: ${ci['Counted Sub Unit OZ/GL Qty']||0}</span>
                </div>`;
            });
            summaryDiv.innerHTML = html;
        }

        function exportExcel() {
            let exportList = poData.map((item, idx) => {
                let cleanItem = {...item};
                delete cleanItem._index;
                
                let unitQty = parseInt(countedUnitData[idx]) || 0;
                let subUnitQty = parseInt(countedSubUnitData[idx]) || 0;
                let subUnitItem = parseFloat(item['Sub unit item']) || 1; 
                
                // ลบคีย์เดิมออกก่อน (ถ้ามี) เพื่อบังคับลำดับคอลัมน์ใหม่ตอนเพิ่มกลับเข้าไป
                delete cleanItem['Counted Unit Qty'];
                delete cleanItem['Counted Sub Unit OZ/GL Qty'];
                delete cleanItem['Convert'];

                cleanItem['Counted Unit Qty'] = unitQty;
                cleanItem['Counted Sub Unit OZ/GL Qty'] = subUnitQty;
                cleanItem['Convert'] = (unitQty * subUnitItem + subUnitQty) / subUnitItem;

                delete cleanItem['Count History'];
                const hist = countHistory[idx] || [];
                cleanItem['Count History'] = hist.map(h =>
                    `${h.location ? h.location + ': ' : ''}Unit ${h.unit}/Sub ${h.subUnit} (${h.time})`
                ).join(' | ');

                return cleanItem;
            });

            customItems.forEach(ci => exportList.push(ci));

            const ws = XLSX.utils.json_to_sheet(exportList);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "Inventory_Result");
            XLSX.writeFile(wb, "Navera_Updated_Inventory.xlsx");
        }
    </script>
</body>
</html>
